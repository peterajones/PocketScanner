<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* A dark desk behind the page so VisionKit has an edge to find when the
     prop is shown full-screen on the Mac and scanned with the phone. */
  html, body { margin: 0; width: 100vw; height: 100vh; background: #2b2b2e; }
  body { display: grid; place-items: center; }
  img { border: 3px solid #d8d8d8;
    box-shadow: 0 18px 50px rgba(0,0,0,.55); }
</style></head>
<body><img id="p"><script>
  const q = new URLSearchParams(location.search), p = document.getElementById("p");
  // Scale the page up or down to fill most of the screen, keeping its shape.
  p.onload = () => { const k = Math.min(innerWidth * .78 / p.naturalWidth, innerHeight * .82 / p.naturalHeight);
    p.style.width = p.naturalWidth * k + "px"; p.style.height = p.naturalHeight * k + "px"; };
  p.src = q.get("src");
  if (q.get("r")) { p.style.borderRadius = q.get("r") + "px"; p.style.border = "none"; }
</script></body></html>
