<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1275px; height: 825px; background: #fff; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; color: #223; padding: 60px 70px; box-sizing: border-box; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid #2a7a8c; padding-bottom: 14px; }
  .head h1 { margin: 0; color: #2a7a8c; font-size: 40px; }
  .head small { font-size: 18px; color: #557; line-height: 1.4; text-align: right; }
  .meta { margin: 26px 0; font-size: 22px; display: flex; gap: 60px; }
  .hand { font-family: "Bradley Hand", cursive; font-size: 30px; color: #1b2a6b; }
  table { border-collapse: collapse; width: 100%; font-size: 22px; }
  th, td { border: 2px solid #2a7a8c; padding: 12px; text-align: center; }
  th { background: #e6f2f4; color: #2a7a8c; }
  .foot { margin-top: 80px; display: flex; justify-content: space-between; font-size: 20px; align-items: flex-end; }
  .sign { border-top: 2px solid #223; width: 380px; padding-top: 6px; position: relative; }
  .sign .hand { position: absolute; top: -52px; left: 20px; font-size: 38px; }
</style></head>
<body>
  <div class="head">
    <div><h1>Clearview Eye Care</h1><div style="font-size:20px;color:#557">Spectacle Prescription</div></div>
    <small>100 Sample Road, Anytown<br>555-0199</small>
  </div>
  <div class="meta">
    <div>Patient:&nbsp; <span class="hand">Jordan Example</span></div>
    <div>Date: <span class="hand">Oct 14, 2026</span></div>
  </div>
  <table>
    <tr><th>Rx</th><th>SPH</th><th>CYL</th><th>AXIS</th><th>ADD</th><th>PRISM</th></tr>
    <tr><th>O.D.</th><td class="hand">−1.75</td><td class="hand">−0.50</td><td class="hand">180</td><td class="hand">—</td><td class="hand">—</td></tr>
    <tr><th>O.S.</th><td class="hand">−2.00</td><td class="hand">−0.75</td><td class="hand">175</td><td class="hand">—</td><td class="hand">—</td></tr>
  </table>
  <div class="foot">
    <div>PD: <span class="hand">63</span> &nbsp;&nbsp; Expires: <span class="hand">Oct 2028</span></div>
    <div class="sign"><span class="hand">D. Optom</span>Dr. Dana Optom, O.D.</div>
  </div>
</body></html>
