<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 850px; height: 1100px; background: #fff; }
  body { font-family: Georgia, serif; color: #223; padding: 56px 64px; box-sizing: border-box; }
  .head { text-align: center; border-bottom: 2px solid #8c3a2a; padding-bottom: 14px; }
  .head h1 { margin: 0; font-size: 34px; color: #8c3a2a; }
  .head div { font-size: 17px; color: #555; line-height: 1.5; }
  .meta { margin-top: 28px; font-size: 20px; line-height: 2.1; }
  .hand { font-family: "Bradley Hand", cursive; font-size: 30px; color: #1b2a6b; }
  .rx { font-size: 96px; font-style: italic; margin: 20px 0 0; color: #333; }
  .script { margin-left: 40px; font-family: "Bradley Hand", cursive; font-size: 32px; color: #1b2a6b; line-height: 1.6; }
  .foot { position: absolute; left: 64px; right: 64px; bottom: 70px; display: flex; justify-content: space-between; align-items: flex-end; font-size: 18px; }
  .sign { border-top: 2px solid #223; width: 340px; padding-top: 6px; position: relative; }
  .sign .hand { position: absolute; top: -54px; left: 30px; font-size: 40px; }
</style></head>
<body>
  <div class="head">
    <h1>Lakeside Family Clinic</h1>
    <div>Dr. Robin Sample, M.D.<br>200 Example Avenue, Anytown · 555-0123</div>
  </div>
  <div class="meta">
    Patient:&nbsp; <span class="hand">Jordan Example</span><br>
    Date: <span class="hand">Oct 14, 2026</span>
  </div>
  <div class="rx">℞</div>
  <div class="script">
    Amoxicillin 500 mg capsules<br>
    Take 1 capsule 3 times daily<br>
    for 7 days<br>
    Qty: 21 &nbsp;·&nbsp; Refills: 0
  </div>
  <div class="foot">
    <div>Licence no. SAMPLE-0000</div>
    <div class="sign"><span class="hand">R. Sample</span>Signature</div>
  </div>
</body></html>
